start:
  name: Playlist starten
  description: Spielt die GIFs eines Ordners wiederholt ab.
  fields:
    device:
      name: Divoom-Gerät
      description: Gerätekennung wie bei der Aktion divoom.image.
      required: true
      example: divoom_pixoo
      selector:
        text:
    folder:
      name: Ordner
      description: Ordner relativ zu /config/pixelart; "." bezeichnet das Stammverzeichnis.
      required: true
      example: wetter/regen
      selector:
        text:
    duration:
      name: Anzeigedauer
      description: Sekunden nach dem erfolgreichen Senden, bis das nächste GIF gesendet wird.
      required: true
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s
          mode: box
    order:
      name: Reihenfolge
      default: alphabetical
      selector:
        select:
          options:
            - value: alphabetical
              label: Alphabetisch
            - value: random
              label: Zufällig
    individual_durations:
      name: Individuelle Anzeigezeiten
      description: Nur GIFs mit gespeicherter individueller Dauer abspielen.
      default: false
      selector:
        boolean:
stop:
  name: Playlist stoppen
  description: Stoppt nach einem laufenden Bildtransfer; das letzte Bild bleibt angezeigt.
brightness_test:
  name: Helligkeit testen
  description: Testet einen Helligkeitswert 30 Sekunden, danach gilt wieder die Automatik.
  fields:
    value:
      name: Helligkeit
      required: true
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
          mode: slider
brightness_configure:
  name: Helligkeitsautomatik konfigurieren
  description: Speichert die Einstellungen der Helligkeitsautomatik. Im Seitenleisten-Panel konfigurieren.
playlist_durations:
  name: Individuelle GIF-Anzeigezeiten speichern
  description: Speichert Anzeigezeiten für GIFs eines Ordners über das Seitenleisten-Panel.
