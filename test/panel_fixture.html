<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Orchestrator Panel Test</title></head>
<body>
  <div id="calls" hidden></div>
  <div id="menu-event" hidden></div>
  <div id="failure" hidden></div>
  <script type="module">
    import "../custom_components/divoom_orchestrator/frontend/panel.js";
    const panel = document.createElement("divoom-orchestrator-panel");
    const events = {};
    let settings = {duration: 5, cooldown: 5, community_sort: 1};
    const folders = new Set([".", "bewegung", "date_events", "date_events/sylvester",
      "date_events/weihnachten", "klingel", "rotation", "wetter"]);
    const gifs = new Map(Array.from(folders, (folder) => [folder, ["cloudy.gif", "new.gif"]]));
    const join = (folder, name) => folder === "." ? name : `${folder}/${name}`;
    const parent = (path) => path.includes("/") ? path.slice(0, path.lastIndexOf("/")) : ".";
    panel.hass = {
      themes: {darkMode: true},
      states: {
        "weather.home": {entity_id: "weather.home", state: "sunny", attributes: {friendly_name: "Testwetter"}},
        "calendar.holidays": {entity_id: "calendar.holidays", state: "off", attributes: {friendly_name: "Feiertage"}},
      },
      callWS: async (request) => {
        document.querySelector("#calls").textContent = JSON.stringify(request);
        if (request.type === "divoom_orchestrator/settings") return {...settings};
        if (request.type === "divoom_orchestrator/settings_save") {
          settings = {duration: request.duration, cooldown: request.cooldown, community_sort: request.community_sort};
          return {...settings};
        }
        if (request.type === "divoom_orchestrator/playlist_files") {
          if (!folders.has(request.folder)) throw new Error("Ordner nicht gefunden");
          return gifs.get(request.folder).map((name) => ({file: join(request.folder, name), duration: null}));
        }
        if (request.type === "divoom_orchestrator/gif_preview") {
          return {data: "R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7", cycle_seconds: 1.5};
        }
        if (request.type === "divoom_orchestrator/event_folders") {
          if (!folders.has(request.folder)) throw new Error("Ordner nicht gefunden");
          const children = Array.from(folders).filter((folder) => folder !== "." && parent(folder) === request.folder).sort();
          return request.include_children ? children.map((path) => ({
            path, has_children: Array.from(folders).some((item) => item !== "." && parent(item) === path),
          })) : children;
        }
        if (request.type === "divoom_orchestrator/media_create") {
          const target = join(request.parent, request.name);
          if (!request.name || request.name.includes("/") || folders.has(target)) throw new Error("Ordner existiert oder Name ungültig");
          folders.add(target); gifs.set(target, []); return target;
        }
        if (request.type === "divoom_orchestrator/media_duplicate") {
          const target = join(request.parent, request.name);
          if (folders.has(target)) throw new Error("Ordner existiert");
          for (const old of Array.from(folders).filter((item) => item === request.source || item.startsWith(`${request.source}/`))) {
            const copy = target + old.slice(request.source.length);
            folders.add(copy); gifs.set(copy, [...gifs.get(old)]);
          }
          return target;
        }
        if (request.type === "divoom_orchestrator/media_mutate") {
          if (request.kind === "gif") {
            const from = parent(request.source), name = request.source.split("/").pop();
            if (request.action === "move") {
              if (gifs.get(request.parent).includes(name)) throw new Error("GIF existiert");
              gifs.get(request.parent).push(name);
            }
            gifs.set(from, gifs.get(from).filter((item) => item !== name));
          } else {
            const target = request.action === "move" ? join(request.parent, request.source.split("/").pop()) : null;
            if (target && folders.has(target)) throw new Error("Ordner existiert");
            for (const old of Array.from(folders).filter((item) => item === request.source || item.startsWith(`${request.source}/`))) {
              if (target) { const moved = target + old.slice(request.source.length); folders.add(moved); gifs.set(moved, gifs.get(old)); }
              folders.delete(old); gifs.delete(old);
            }
          }
          return null;
        }
        if (request.type === "divoom_orchestrator/community_search") {
          return {search_id: "fixture", has_more: request.page === 1, works: request.page === 1 ? [
            {id: 42, title: "Testbild", author: "Testautor", importable: true},
            {id: 43, title: "Geschützt", author: "Testautor", importable: false},
          ] : []};
        }
        if (request.type === "divoom_orchestrator/community_preview") {
          return {data: "R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"};
        }
        if (request.type === "divoom_orchestrator/community_import") {
          return {file: `${request.folder === "." ? "" : `${request.folder}/`}divoom-${request.gallery_id}.gif`};
        }
        if (request.type === "divoom_orchestrator/events") return events;
        if (request.type === "divoom_orchestrator/holiday_names") return ["Ostersonntag", "Weihnachten"];
        if (request.type === "divoom_orchestrator/rotation") return null;
        if (request.type === "divoom_orchestrator/rotation_save") return;
        if (request.type === "divoom_orchestrator/rotation_start") return;
        if (request.type === "divoom_orchestrator/rotation_stop") return;
        if (request.type === "divoom_orchestrator/event_save") { events[request.name] = request.event; return; }
        if (request.type === "divoom_orchestrator/event_delete") { delete events[request.name]; return; }
        if (request.type === "divoom_orchestrator/event_test") return;
        return {
          enabled: true, device: "divoom_pixoo", motion: "", connection: "",
          morning: "05:00", day: 100, twilight: 50, night: 10,
        };
      },
      callService: async (domain, action, data) => {
        document.querySelector("#calls").textContent = JSON.stringify({domain, action, data});
        if (document.querySelector("#failure").textContent) throw new Error("Testfehler");
      },
      callApi: async (method, path) => path === "events" ? [{event: "state_changed"}, {event: "klingel"}] : [],
    };
    panel.addEventListener("hass-toggle-menu", () => {
      document.querySelector("#menu-event").textContent = "opened";
    });
    document.body.appendChild(panel);
  </script>
</body>
</html>
