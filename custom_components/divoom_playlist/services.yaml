start:
  name: Start playlist
  description: Play the GIFs directly in a folder repeatedly.
  fields:
    device:
      name: Divoom device
      description: Device identifier used by divoom.image.
      required: true
      example: divoom_pixoo
      selector:
        text:
    folder:
      name: Folder
      description: Folder relative to /config/pixelart; use "." for the root.
      required: true
      example: wetter/regen
      selector:
        text:
    duration:
      name: Duration
      description: Seconds to show each GIF before sending the next one.
      required: true
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s
          mode: box
    order:
      name: Order
      default: alphabetical
      selector:
        select:
          options:
            - alphabetical
            - random
stop:
  name: Stop playlist
  description: Stop sending further GIFs; the currently displayed image remains.
